<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel de Pedidos - Tempo Real</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <style>
        /* Estilo para a caixa de mensagens */
        #mensagens {
            height: 320px;
            overflow-y: auto;
            background-color: #f9f9f9;
            border: 1px solid #edf2f7;
            border-radius: 6px;
            padding: 15px;
        }
        .msg-alerta {
            margin-bottom: 8px !important;
            padding: 10px 15px !important;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <section class="section">
        <div class="container" style="max-width: 550px;">
            <div class="box sh">
                <div class="has-text-centered mb-5">
                    <h1 class="title is-4 has-text-dark">
                        🍔 Central de Notificações
                    </h1>
                    <p class="subtitle is-6 has-text-grey">Acompanhamento de Pedidos em Tempo Real</p>
                </div>
                
                <div id="mensagens" class="content mb-4"></div>
                
                <div class="field has-addons">
                    <div class="control is-expanded">
                        <input class="input is-primary" type="text" id="inputPedido" placeholder="Ex: 2 Burgers Bacon + Batata Frita">
                    </div>
                    <div class="control">
                        <button class="button is-primary" onclick="enviarMensagem()">
                            Enviar Pedido
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Conecta ao servidor WebSocket pela porta 8765
        const ws = new WebSocket('ws://localhost:8765');
        const divMensagens = document.getElementById('mensagens');

        // Monitora a abertura da conexão
        ws.onopen = () => {
            adicionarMensagemNaTela("✅ Conectado ao servidor de produção.", "is-success is-light");
        };

        // Recebe o broadcast do servidor
        ws.onmessage = (event) => {
            const dados = JSON.parse(event.data);
            adicionarMensagemNaTela(`🔔 ${dados.texto} (Cliente ID: ${dados.remetente})`, "is-info is-light");
        };

        // Envia os dados estruturados em JSON
        function enviarMensagem() {
            const input = document.getElementById('inputPedido');
            if (input.value.trim() === '') return;

            const mensagem = { pedido: input.value };
            ws.send(JSON.stringify(mensagem));
            input.value = '';
        }

        // Renderiza na tela utilizando os componentes de notificação do Bulma
        function adicionarMensagemNaTela(texto, classeBulma) {
            const div = document.createElement('div');
            div.className = `notification msg-alerta ${classeBulma}`;
            div.textContent = texto;
            
            divMensagens.appendChild(div);
            // Faz o scroll rolar automaticamente para a última mensagem recebida
            divMensagens.scrollTop = divMensagens.scrollHeight;
        }
    </script>
</body>
</html>
